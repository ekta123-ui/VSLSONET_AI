<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" role="img" aria-labelledby="title description">
  <title id="title">Sentiment classification confusion matrices</title>
  <desc id="description">Confusion matrices for the SVM and LSTM review sentiment classifiers on the same 193-review test split. Rows are actual classes and columns are predicted classes. Class order is Negative, Neutral, Positive.</desc>
  <style>
    text { font-family: Arial, Helvetica, sans-serif; fill: #202a35; }
    .title { font-size: 25px; font-weight: 700; }
    .subtitle { font-size: 13px; fill: #526171; }
    .model { font-size: 18px; font-weight: 700; }
    .metric { font-size: 13px; fill: #526171; }
    .axis-title { font-size: 12px; font-weight: 700; }
    .tick { font-size: 12px; }
    .count { font-size: 16px; font-weight: 700; }
    .footnote { font-size: 12px; fill: #526171; }
    .cell { stroke: #ffffff; stroke-width: 3; }
  </style>
  <text class="title" x="500" y="43" text-anchor="middle">Review sentiment classification</text>
  <text class="subtitle" x="500" y="68" text-anchor="middle">Confusion matrices · held-out stratified test split · n = 193</text>

  <text class="model" x="310" y="115" text-anchor="middle">SVM</text>
  <text class="metric" x="310" y="138" text-anchor="middle">Accuracy: 81.3%</text>
  <text class="model" x="730" y="115" text-anchor="middle">LSTM</text>
  <text class="metric" x="730" y="138" text-anchor="middle">Accuracy: 41.5%</text>

  <text class="axis-title" x="55" y="296" text-anchor="middle" transform="rotate(-90 55 296)">Actual class</text>
  <text class="axis-title" x="500" y="492" text-anchor="middle">Predicted class</text>

  <!-- SVM confusion matrix: rows actual, columns predicted. -->
  <text class="tick" x="126" y="195" text-anchor="end">Negative (n=94)</text>
  <text class="tick" x="126" y="275" text-anchor="end">Neutral (n=13)</text>
  <text class="tick" x="126" y="355" text-anchor="end">Positive (n=86)</text>
  <text class="tick" x="172" y="390" text-anchor="middle">Negative</text>
  <text class="tick" x="252" y="390" text-anchor="middle">Neutral</text>
  <text class="tick" x="332" y="390" text-anchor="middle">Positive</text>
  <rect class="cell" x="132" y="158" width="80" height="80" fill="#225ea8" />
  <rect class="cell" x="212" y="158" width="80" height="80" fill="#f0f5fa" />
  <rect class="cell" x="292" y="158" width="80" height="80" fill="#83add2" />
  <rect class="cell" x="132" y="238" width="80" height="80" fill="#dce8f2" />
  <rect class="cell" x="212" y="238" width="80" height="80" fill="#f7f9fb" />
  <rect class="cell" x="292" y="238" width="80" height="80" fill="#e7eff6" />
  <rect class="cell" x="132" y="318" width="80" height="80" fill="#d4e3ef" />
  <rect class="cell" x="212" y="318" width="80" height="80" fill="#f7f9fb" />
  <rect class="cell" x="292" y="318" width="80" height="80" fill="#2c6eaa" />
  <text class="count" x="172" y="205" text-anchor="middle" fill="#ffffff">80</text>
  <text class="count" x="252" y="205" text-anchor="middle">1</text>
  <text class="count" x="332" y="205" text-anchor="middle">13</text>
  <text class="count" x="172" y="285" text-anchor="middle">8</text>
  <text class="count" x="252" y="285" text-anchor="middle">1</text>
  <text class="count" x="332" y="285" text-anchor="middle">4</text>
  <text class="count" x="172" y="365" text-anchor="middle">10</text>
  <text class="count" x="252" y="365" text-anchor="middle">0</text>
  <text class="count" x="332" y="365" text-anchor="middle" fill="#ffffff">76</text>

  <!-- LSTM confusion matrix: rows actual, columns predicted. -->
  <text class="tick" x="546" y="195" text-anchor="end">Negative (n=94)</text>
  <text class="tick" x="546" y="275" text-anchor="end">Neutral (n=13)</text>
  <text class="tick" x="546" y="355" text-anchor="end">Positive (n=86)</text>
  <text class="tick" x="592" y="390" text-anchor="middle">Negative</text>
  <text class="tick" x="672" y="390" text-anchor="middle">Neutral</text>
  <text class="tick" x="752" y="390" text-anchor="middle">Positive</text>
  <rect class="cell" x="552" y="158" width="80" height="80" fill="#f3f7fa" />
  <rect class="cell" x="632" y="158" width="80" height="80" fill="#eaf1f7" />
  <rect class="cell" x="712" y="158" width="80" height="80" fill="#1f5f9f" />
  <rect class="cell" x="552" y="238" width="80" height="80" fill="#f7f9fb" />
  <rect class="cell" x="632" y="238" width="80" height="80" fill="#f3f7fa" />
  <rect class="cell" x="712" y="238" width="80" height="80" fill="#e5eef5" />
  <rect class="cell" x="552" y="318" width="80" height="80" fill="#f1f6fa" />
  <rect class="cell" x="632" y="318" width="80" height="80" fill="#eaf1f7" />
  <rect class="cell" x="712" y="318" width="80" height="80" fill="#2b6da8" />
  <text class="count" x="592" y="205" text-anchor="middle">2</text>
  <text class="count" x="672" y="205" text-anchor="middle">6</text>
  <text class="count" x="752" y="205" text-anchor="middle" fill="#ffffff">86</text>
  <text class="count" x="592" y="285" text-anchor="middle">0</text>
  <text class="count" x="672" y="285" text-anchor="middle">1</text>
  <text class="count" x="752" y="285" text-anchor="middle">12</text>
  <text class="count" x="592" y="365" text-anchor="middle">4</text>
  <text class="count" x="672" y="365" text-anchor="middle">5</text>
  <text class="count" x="752" y="365" text-anchor="middle" fill="#ffffff">77</text>

  <text class="footnote" x="500" y="535" text-anchor="middle">Classes are score-derived (0–4 negative, 5–6 neutral, 7–10 positive), not human-annotated.</text>
  <text class="footnote" x="500" y="557" text-anchor="middle">Rows show actual labels; columns show predicted labels. Values are review counts.</text>
  <text class="footnote" x="500" y="589" text-anchor="middle">Source: project evaluation results; single 80/20 stratified split.</text>
</svg>